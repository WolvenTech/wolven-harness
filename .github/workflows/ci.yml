name: CI

on:
  pull_request:
    branches: [main]
    # why: `edited` re-checks a renamed title as PR metadata; only a base-branch
    # change also runs the code jobs.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'edit' || 'code' }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the PR title against Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # why: `pnpm comments` diffs against the merge-base with origin/main; a
          # shallow, single-ref checkout has neither that branch nor the history
          # needed to compute it.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint and format
        run: pnpm lint

      - name: Validate harness
        run: pnpm validate

      - name: Check comments
        run: pnpm comments

      - name: Score harness
        run: pnpm score

  test:
    name: Test (Node ${{ matrix.line }})
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # why: a bare major resolves from the runner's tool cache, which can lag a security patch.
        include:
          - line: 22
            node: "22.23.4"
          - line: 24
            node: "24.22.1"
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # why: doctor fixtures read release tags to exercise historical template drift.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  package:
    name: Package
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # why: packs with the release job's npm, so a bad manifest fails here
      # rather than after the release tag exists.
      - name: Set up release npm
        run: npm install -g npm@11.20.0

      - name: Pack
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/*.tgz "$RUNNER_TEMP/package.tgz"

      # why: installs the packed tarball into an empty repo, which catches files
      # the published package omits and the in-repo tests cannot see.
      - name: Smoke test the packed CLI
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          git init --quiet
          echo '{"name":"smoke","private":true}' > package.json
          # why: validate unions untracked non-ignored paths; node_modules must stay gitignored.
          echo 'node_modules/' > .gitignore
          pnpm add --save-dev "$RUNNER_TEMP/package.tgz"
          version="$(pnpm exec wolven-harness --version)"
          [[ "$version" == "@wolven-tech/harness "* ]]
          pnpm exec wolven-harness setup --git-host gh --runtimes claude,codex --skills ship < /dev/null
          pnpm exec wolven-harness validate
          score_version="$(node -p "require('$GITHUB_WORKSPACE/package.json').devDependencies['harness-score']")"
          pnpm add --save-dev --save-exact "harness-score@$score_version"
          pnpm harness:score

  # why: branch protection reads the newest Actions suite for the check name CI.
  # A title-only edit still has to report CI, and only once this head SHA's code
  # jobs have passed — the merge ref is a different commit, and a title change
  # must not pass a failed code run or leave CI unreported.
  ci:
    name: CI
    needs: [title, lint, test, package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every job to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          TITLE_RESULT: ${{ needs.title.result }}
          EDIT_ONLY: ${{ github.event.action == 'edited' && !github.event.changes.base }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          if [[ "$EDIT_ONLY" == true ]]; then
            [[ "$TITLE_RESULT" == success ]] || { echo "Title: $TITLE_RESULT"; exit 1; }
            deadline=$((SECONDS + 840))
            while true; do
              state="$(
                gh api --paginate "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" | jq -s -r '
                  def names: ["Lint", "Test (Node 22)", "Test (Node 24)", "Package"];
                  if length == 0 then error("no check-run pages") else . end
                  | [.[].check_runs[]] as $runs
                  | [names[] as $name
                      | ($runs | map(select(.name == $name and .conclusion != "skipped"))) as $live
                      | if ($live | length) == 0 then {name: $name, state: "wait"}
                        else ($live | sort_by(.started_at) | last) as $latest
                          | if $latest.status != "completed" then {name: $name, state: "wait"}
                            elif $latest.conclusion != "success" then {name: $name, state: "fail"}
                            else {name: $name, state: "pass"}
                            end
                        end
                    ] as $rows
                  | if any($rows[]; .state == "fail") then "fail"
                    elif any($rows[]; .state == "wait") then "wait"
                    else "pass"
                    end
                '
              )"
              echo "code checks: $state"
              if [[ "$state" == pass ]]; then exit 0; fi
              if [[ "$state" == fail ]]; then exit 1; fi
              if (( SECONDS >= deadline )); then
                echo "code checks still running"
                exit 1
              fi
              sleep 15
            done
          fi
          for result in $RESULTS; do [[ "$result" == success ]] || exit 1; done
