name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # why: `pnpm comments` diffs against the merge-base with origin/main; a
          # shallow, single-ref checkout has neither that branch nor the history
          # needed to compute it.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint and format
        run: pnpm lint

      - name: Validate harness
        run: pnpm validate

      - name: Check comments
        run: pnpm comments

      - name: Score harness
        run: pnpm score

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  package:
    name: Package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # why: packs with the release job's npm, so a bad manifest fails here
      # rather than after the release tag exists.
      - name: Set up release npm
        run: npm install -g npm@11.20.0

      - name: Pack
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/*.tgz "$RUNNER_TEMP/package.tgz"

      # why: installs the packed tarball into an empty repo, which catches files
      # the published package omits and the in-repo tests cannot see.
      - name: Smoke test the packed CLI
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          git init --quiet
          echo '{"name":"smoke","private":true}' > package.json
          pnpm add --save-dev "$RUNNER_TEMP/package.tgz"
          version="$(pnpm exec wolven-harness --version)"
          [[ "$version" == "@wolven-tech/harness "* ]]
          pnpm exec wolven-harness setup --git-host gh --runtimes claude,codex --skills ship < /dev/null
          pnpm exec wolven-harness validate
          score_version="$(node -p "require('$GITHUB_WORKSPACE/package.json').devDependencies['harness-score']")"
          pnpm add --save-dev --save-exact "harness-score@$score_version"
          pnpm harness:score
