<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journey map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #f6f6f9;
  --grid: #dcdce6;
  --card: #ffffff;
  --line: #e3e3ec;
  --ink: #1d1d27;
  --muted: #6e7180;
  --select: #5b5bd6;
  --select-soft: #eeeefd;
  --accent: #5b5bd6;
  --edge: #a3a6b4;
  --link: #8b5cf6;
  --warn: #c2410c;
  --warn-bg: #fff1e8;
  --tag-ink: #4b5060;
  --tag-bg: #f0f1f5;
  --rec-ink: #0f766e;
  --rec-bg: #e3f6f2;
  --sticky-ink: #6b4e00;
  --sticky-bg: #fff4c2;
  --pain: #dc2626;
  --pain-bg: #fde8e8;
  --opp: #12a150;
  --opp-bg: #e0f5ea;
  --k-choice: #5b5bd6;
  --k-check: #2563eb;
  --k-text: #0f766e;
  --k-step: #6e7180;
  --k-card: #1d1d27;
  --shadow: 0 1px 2px rgba(20, 20, 40, .06), 0 4px 16px rgba(20, 20, 40, .06);
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px var(--ui); overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
#stage {
  position: fixed; inset: 0; touch-action: none; cursor: grab;
  background-color: var(--paper);
  background-image: radial-gradient(circle, var(--grid) 1px, transparent 1.2px);
}
#stage.panning { cursor: grabbing; }
#stage:focus { outline: none; }
.morewrap { position: relative; display: block; }
#menu { position: absolute; top: 40px; right: 0; z-index: 8; min-width: 230px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; display: flex; flex-direction: column; }
#menu button { appearance: none; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 8px 10px; border-radius: 8px; font: 500 13px var(--ui); color: var(--ink); cursor: pointer; text-align: left; }
#menu button:hover:not(:disabled) { background: var(--tag-bg); }
#menu button:disabled { opacity: .4; cursor: default; }
#menu button[aria-checked="true"] span::after { content: " ✓"; color: var(--select); }
#menu kbd { font: 600 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--muted); background: var(--paper); }
#timeline { bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px); height: 120px; overflow-x: auto; overflow-y: hidden; padding: 0; }
#timeline svg { display: block; flex: none; }
.tl-zero { stroke: var(--line); stroke-dasharray: 3 4; }
.tl-seg { stroke-width: 3; stroke-linecap: round; fill: none; }
.tl-cap { font: 600 9px var(--ui); letter-spacing: .1em; fill: var(--muted); }
.tl-pt { cursor: pointer; }
.tl-dot { stroke-width: 2; }
.tl-newest { fill: none; stroke: var(--select); stroke-width: 2; opacity: .5; }
.tl-face { font-size: 14px; pointer-events: none; font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
#canvas { width: 100%; height: 100%; display: block; }
#canvas text { user-select: none; -webkit-user-select: none; }

.card { fill: var(--card); stroke: var(--line); stroke-width: 1; filter: url(#lift); }
.card.start { fill: var(--select-soft); stroke: var(--select); stroke-width: 1.5; }
.card.k-waypoint { fill: #fafafc; stroke: #c9cbd6; stroke-dasharray: 6 5; filter: none; }
.card.k-step { fill: #fff; stroke: #c9cbd6; }
.card.k-card { stroke: #cfd0dc; }
.opt { fill: var(--card); stroke: var(--line); stroke-width: 1; transition: fill .12s, stroke .12s; }
.hit:hover .opt, .hit:focus-visible .opt { fill: #f7f7ff; stroke: var(--select); }
.opt.chosen { fill: var(--select-soft); stroke: var(--select); stroke-width: 1.5; }
.radio { fill: var(--card); stroke: #b8bac8; stroke-width: 1.5; }
.radio.on { stroke: var(--select); }
.radio-dot { fill: var(--select); }
.row { fill: transparent; transition: fill .12s; }
.hit:hover .row, .hit:focus-visible .row { fill: #f4f5fb; }
.box { fill: var(--card); stroke: #b8bac8; stroke-width: 1.5; }
.box.on { fill: var(--select); stroke: var(--select); }
.tick { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.primary { fill: var(--select); transition: fill .12s; }
.hit:hover .primary, .hit:focus-visible .primary { fill: #4747c2; }
.rule { stroke: var(--line); }
.note-btn { fill: transparent; transition: fill .12s; }
.note-btn.has { fill: var(--sticky-bg); }
.hit:hover .note-btn, .hit:focus-visible .note-btn { fill: var(--tag-bg); }
.pencil { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linejoin: round; }
.row.bar { fill: transparent; }
.bband { fill: transparent; transition: fill .12s; }
.hit:hover .bband, .hit:focus-visible .bband { fill: rgba(255, 255, 255, .3); }
.bband.neu { fill: transparent; }
.hit:hover .bband.neu, .hit:focus-visible .bband.neu { fill: rgba(0, 0, 0, .08); }
.bband.has { fill: var(--sticky-bg); }
.hit:focus-visible .bband { stroke: var(--ink); stroke-width: 2; }
.band-ico { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cloud-shadow { filter: drop-shadow(0 4px 7px rgba(20, 20, 40, .16)); }
.cloud-edge { fill: #fff; stroke: #c3c8dc; stroke-width: 3; }
.cloud-fill { fill: #fff; stroke: none; }
.cloud-dot { fill: #fff; stroke: #c3c8dc; stroke-width: 1.6; filter: drop-shadow(0 2px 3px rgba(20, 20, 40, .14)); }
.stickybox { stroke-width: 1; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .12)); }
.sticky { fill: var(--sticky-bg); stroke: #f1df8a; }
.hit { cursor: pointer; outline: none; }
.hit:focus-visible .opt, .hit:focus-visible .row, .hit:focus-visible .note-btn { stroke: var(--select); stroke-width: 2; }
.hit:focus-visible .primary { stroke: var(--ink); stroke-width: 2; }
.dim { opacity: .45; }
.faded { opacity: .3; transition: opacity .15s; }
.ghost { opacity: .32; }
.faded:hover, .ghost:hover, .faded:focus-within, .ghost:focus-within { opacity: .7; }

.island {
  position: fixed; z-index: 2; background: rgba(255, 255, 255, .92); backdrop-filter: blur(8px);
  border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line);
  display: flex; align-items: center; gap: 4px; padding: 4px;
}
#top { top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; right: 16px; padding: 6px 6px 6px 16px; gap: 12px; flex-wrap: wrap; }
#top .heading { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
#top h1 { margin: 0; font: 600 15px/1.25 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top p { margin: 0; font: 400 12.5px/1.3 var(--ui); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#zoom { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: 16px; }
.btn {
  appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink);
  height: 34px; min-width: 34px; padding: 0 12px; border-radius: 9px;
  font: 500 13px var(--ui); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
}
.btn:hover { background: var(--tag-bg); }
.btn:focus-visible { outline: 2px solid var(--select); outline-offset: 1px; }
.btn.secondary { border-color: var(--line); background: var(--card); }
.btn.secondary[aria-pressed="true"] { background: var(--select-soft); border-color: var(--select); color: var(--select); }
.btn.primary-btn { background: var(--select); color: #fff; }
.btn.primary-btn:hover { background: #4747c2; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#pct { min-width: 56px; font-variant-numeric: tabular-nums; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }
#status {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 2;
  padding: 8px 12px; font: 500 12.5px var(--ui); color: var(--muted);
  background: rgba(255, 255, 255, .92); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
}
#canvas .node-input {
  width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: #fbfbfd;
  font: 400 14px var(--ui); padding: 0 10px; color: var(--ink);
}
#canvas .node-input:focus { outline: 2px solid var(--select); outline-offset: -1px; background: #fff; }
#canvas .note-input { background: var(--sticky-bg); border-color: #f1df8a; font: 500 19px Caveat, cursive; color: var(--sticky-ink); }
#feedback-panel {
  position: fixed; right: 16px; bottom: 70px; z-index: 4; background: var(--card); padding: 16px;
  border: 1px solid var(--line); border-radius: 12px; width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
}
#feedback-panel label { font: 600 13px var(--ui); }
#feedback { width: 100%; height: 170px; font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
#feedback-panel .btn { align-self: flex-end; }
#errors {
  position: fixed; inset: 100px 24px 80px; overflow: auto; z-index: 5; background: var(--card);
  border: 1px solid var(--warn); border-radius: 12px; padding: 24px; box-shadow: var(--shadow);
}
#errors h2 { margin: 0 0 12px; font: 600 18px var(--ui); color: var(--warn); }
#errors pre { margin: 0; white-space: pre-wrap; font: 13px/1.6 ui-monospace, Menlo, monospace; }
@media (max-width: 720px) {
  #top p { display: none; }
  #top { gap: 6px; }
  #status { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .opt, .row, .primary, .note-btn, .faded { transition: none; }
}
</style>
</head><body>
<header class="island" id="top">
  <div class="heading"><h1 id="title"></h1><p id="subtitle"></p></div>
  <button class="btn secondary" id="prev" type="button" hidden>Prev</button>
  <button class="btn secondary" id="next" type="button" hidden>Next</button>
  <button class="btn" id="reset" type="button">Start over</button>
  <span class="morewrap"><button class="btn" id="more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More controls">⋯</button><div id="menu" role="menu" hidden></div></span>
  <button class="btn primary-btn" id="copy" type="button">Copy for agent</button>
</header>

<div id="stage">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="Clickable journey map">
    <defs><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#14142a" flood-opacity=".08"/></filter></defs>
    <g id="world"></g>
  </svg>
</div>

<div class="island" id="timeline" hidden></div>
<div class="island" id="zoom" role="group" aria-label="Zoom">
  <button class="btn" id="zout" type="button" aria-label="Zoom out"><svg viewBox="0 0 20 20"><path d="M5 10h10"/></svg></button>
  <button class="btn" id="pct" type="button" aria-label="Reset zoom to 100%">100%</button>
  <button class="btn" id="zin" type="button" aria-label="Zoom in"><svg viewBox="0 0 20 20"><path d="M5 10h10M10 5v10"/></svg></button>
  <span class="sep"></span>
  <button class="btn" id="fit" type="button" aria-label="Fit everything shown"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
</div>

<section id="errors" hidden role="alert"><h2>This map needs a fix</h2><pre id="error-text"></pre></section>
<section id="feedback-panel" hidden><label for="feedback">Copy this and paste it into your agent chat</label><textarea id="feedback" readonly></textarea><button class="btn secondary" id="close-feedback" type="button">Close</button></section>
<div id="status" role="status" aria-live="polite"></div>
<script id="map-data" type="application/json">@@DATA@@</script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6" crossorigin="anonymous"></script>
<!-- journey-map:renderer --><script>@@RENDERER@@</script><!-- journey-map:renderer -->
</body></html>
